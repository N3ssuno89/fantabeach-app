<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mercato coppie 2027 – FantaBeach (anteprima)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
:root{
  --bg0:#F4EDE0; --bg1:#E3D5BB; --ink:#0F231B; --ink-soft:#56685F; --line:rgba(15,35,27,.14);
  --hud:rgba(255,252,246,.72); --hud-line:rgba(15,35,27,.14);
  --court:rgba(15,35,27,.24); --court-glow:rgba(255,178,30,.22);
  --sweep:rgba(255,178,30,.34); --floor-shadow:rgba(15,35,27,.4);
  --no:#DD431D; --yes:#10865E; --on-act:#FFFFFF; --focus:#FF6B2C;
  --o:#FF6B2C; --y:#FFB21E; --m:#3FD6A0; --sand:#F3ECDD;
  --c-in1:#143528; --c-in2:#081610; --c-ink:#F3ECDD; --c-soft:#9EB3A9; --c-line:rgba(243,236,221,.1);
  --t-top:#FFB21E; --t-elite:#C084FC; --t-solid:#3FD6A0; --t-value:#FF6B2C; --t-out:#9AA59F;
  --sil:rgba(243,236,221,.24); --jersey:#2D5C4F;
  --display:"Big Shoulders Display","Avenir Next Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  --ui:"Chakra Petch","Avenir Next","Segoe UI",Roboto,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg0:#05100C; --bg1:#0F2B21; --ink:#F3ECDD; --ink-soft:#9DB2A8; --line:rgba(243,236,221,.14);
    --hud:rgba(9,26,20,.68); --hud-line:rgba(243,236,221,.14);
    --court:rgba(243,236,221,.2); --court-glow:rgba(63,214,160,.32);
    --sweep:rgba(255,178,30,.13); --floor-shadow:rgba(0,0,0,.75);
    --no:#FF5B3D; --yes:#3FD6A0; --on-act:#05100C;
    color-scheme:dark;
  }
  :root:not([data-theme="light"]) .logo-dark{display:none}
  :root:not([data-theme="light"]) .logo-light{display:block}
}
:root[data-theme="dark"]{
  --bg0:#05100C; --bg1:#0F2B21; --ink:#F3ECDD; --ink-soft:#9DB2A8; --line:rgba(243,236,221,.14);
  --hud:rgba(9,26,20,.68); --hud-line:rgba(243,236,221,.14);
  --court:rgba(243,236,221,.2); --court-glow:rgba(63,214,160,.32);
  --sweep:rgba(255,178,30,.13); --floor-shadow:rgba(0,0,0,.75);
  --no:#FF5B3D; --yes:#3FD6A0; --on-act:#05100C;
  color-scheme:dark;
}
:root[data-theme="dark"] .logo-dark{display:none}
:root[data-theme="dark"] .logo-light{display:block}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg0);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.45;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default;opacity:.5}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}

/* Arena: campo da beach di notte (o di giorno) in prospettiva */
.arena{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:radial-gradient(130% 75% at 50% -5%,var(--bg1) 0%,var(--bg0) 62%)}
.arena .sweep{position:absolute;left:-40%;top:-10%;width:180%;height:85%;background:radial-gradient(30% 45% at 35% 40%,var(--sweep),transparent 70%);animation:sweep 16s ease-in-out infinite alternate}
@keyframes sweep{from{transform:translateX(-14%)}to{transform:translateX(16%)}}
.arena .courtsvg{position:absolute;left:0;bottom:0;width:100%;height:48vh;color:var(--court);filter:drop-shadow(0 0 6px var(--court-glow));-webkit-mask-image:linear-gradient(to top,#000 45%,transparent);mask-image:linear-gradient(to top,#000 45%,transparent)}

.app{position:relative;z-index:1;max-width:460px;min-height:100vh;min-height:100dvh;margin:0 auto;display:flex;flex-direction:column;padding:12px 16px calc(16px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:center;gap:8px}
.logo{height:32px;width:auto;display:block;flex:none}
.logo-light{display:none}
.gtoggle{margin-left:auto;display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--hud);border:1px solid var(--hud-line)}
.gtoggle button{border:0;background:transparent;color:var(--ink-soft);font-weight:600;font-size:13px;padding:7px 11px;border-radius:999px;line-height:1}
.gtoggle button[aria-pressed="true"]{background:var(--ink);color:var(--bg0)}
.mine{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--hud-line);background:var(--hud);border-radius:999px;padding:6px 11px 6px 9px;font-weight:700;font-size:14px;line-height:1;flex:none}
.mine svg{width:18px;height:18px}
.mine.bump{animation:bump .55s cubic-bezier(.3,1.7,.5,1)}
@keyframes bump{35%{transform:scale(1.28);box-shadow:0 0 22px var(--y)}}
.progress{display:flex;align-items:center;gap:10px;margin-top:12px}
.ptrack{flex:1;height:4px;border-radius:9px;background:var(--line);overflow:hidden}
.pfill{height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--o),var(--y),var(--m));box-shadow:0 0 10px var(--y);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.pmeta{font-size:12px;font-weight:600;color:var(--ink-soft);white-space:nowrap}
.sim{display:inline-block;font-family:var(--ui);font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--hud-line);color:var(--ink-soft);white-space:nowrap;vertical-align:middle}

/* Palco */
.stage{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 0 4px;text-align:center}
.stage.top{justify-content:flex-start}
.cardwrap{position:relative;perspective:1100px}
.cardwrap.float{animation:float 5.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-10px) rotate(.5deg)}}
.card3d{position:relative;border-radius:26px;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .3s ease-out;will-change:transform}
.card3d.dragging{transition:none}
.holo{--tier:var(--t-out);position:relative;padding:2px;border-radius:26px;background:linear-gradient(135deg,var(--o),var(--y),var(--m),var(--sand));background:conic-gradient(from var(--ang),var(--o),var(--y),var(--m),var(--sand),var(--o));animation:spin 7s linear infinite;box-shadow:0 34px 60px -26px rgba(255,107,44,.55),0 18px 40px -18px rgba(0,0,0,.55)}
@keyframes spin{to{--ang:360deg}}
.face{position:relative;border-radius:24px;overflow:hidden;color:var(--c-ink);background:radial-gradient(120% 55% at 50% 0%,rgba(63,214,160,.2),rgba(63,214,160,0) 60%),linear-gradient(165deg,var(--c-in1),var(--c-in2))}
.face::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(var(--c-line) 1px,transparent 1px),linear-gradient(90deg,var(--c-line) 1px,transparent 1px);background-size:20px 20px;-webkit-mask-image:linear-gradient(#000,transparent 65%);mask-image:linear-gradient(#000,transparent 65%)}
.shine{position:absolute;inset:0;border-radius:26px;pointer-events:none;z-index:3;background:linear-gradient(115deg,rgba(255,255,255,0) 38%,rgba(255,255,255,.2) 48%,rgba(255,255,255,0) 58%);background-size:260% 100%;background-position:var(--sx,110%) 0;transition:background-position .3s ease-out;mix-blend-mode:screen}
@media (hover:none){ .shine{animation:shineSweep 5s ease-in-out infinite} }
@keyframes shineSweep{0%,100%{background-position:115% 0}50%{background-position:-15% 0}}
.floorshadow{width:58%;height:22px;margin:4px auto 0;border-radius:50%;background:radial-gradient(closest-side,var(--floor-shadow),transparent);animation:shadow 5.5s ease-in-out infinite;transition:opacity .2s}
@keyframes shadow{0%,100%{transform:scaleX(1);opacity:.9}50%{transform:scaleX(.82);opacity:.55}}

.pl,.soloface,.mholo{--tier:var(--t-out)}
.t-top{--tier:var(--t-top)} .t-elite{--tier:var(--t-elite)} .t-solid{--tier:var(--t-solid)} .t-value{--tier:var(--t-value)} .t-out{--tier:var(--t-out)}
.orb{--tier:var(--t-out);position:relative;display:block;flex:none;width:96px;height:96px;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.34),rgba(255,255,255,0) 55%),radial-gradient(circle at 50% 62%,var(--tier) 0%,rgba(8,22,16,.92) 80%);box-shadow:0 0 0 2px var(--tier),0 0 28px -4px var(--tier)}
.orb.t-top{--tier:var(--t-top)} .orb.t-elite{--tier:var(--t-elite)} .orb.t-solid{--tier:var(--t-solid)} .orb.t-value{--tier:var(--t-value)} .orb.t-out{--tier:var(--t-out)}
.orb svg{position:absolute;left:9%;bottom:-3%;width:82%;height:auto}
.orb.sil{background:radial-gradient(circle at 50% 62%,#2F463C,#0E1B16 80%);box-shadow:0 0 0 2px #56685F}
.surname{display:block;width:100%;margin-top:10px;font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:26px;line-height:1;white-space:nowrap;overflow:hidden;color:var(--c-ink)}
.fname{display:block;width:100%;font-size:13px;color:var(--c-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.tierl{display:inline-block;margin-top:6px;font-size:11.5px;font-weight:600;color:var(--tier)}
.fhead{position:relative;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--c-soft);padding:0 4px;text-align:left}
.chip{border:1px solid var(--c-line);border-radius:999px;padding:2px 9px;color:var(--c-ink);font-weight:600;font-size:11.5px;background:rgba(243,236,221,.06);white-space:nowrap}
.pairface{width:min(84vw,330px);padding:14px 12px 12px}
.duo{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:14px}
.pl{display:flex;flex-direction:column;align-items:center;min-width:0}
.joiner{position:absolute;left:50%;top:36px;width:28px;height:28px;margin-left:-14px;border-radius:50%;display:grid;place-items:center;background:var(--c-in2);box-shadow:0 0 0 1px var(--c-line),0 0 14px rgba(255,178,30,.35);color:var(--y);font-family:var(--display);font-weight:900;font-size:20px;line-height:1;z-index:2}
.fstats{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin-top:14px;padding-top:10px;border-top:1px solid var(--c-line)}
.fstats.two{grid-template-columns:repeat(2,minmax(0,1fr));width:100%}
.fstats b{display:block;font-family:var(--display);font-weight:800;font-size:23px;line-height:1;color:var(--c-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fstats span{display:block;font-size:11px;color:var(--c-soft);line-height:1.25;margin-top:2px}
.soloface{width:min(66vw,250px);padding:14px 14px 12px;display:flex;flex-direction:column;align-items:center}
.soloface .fhead{width:100%}
.soloface .tierl{margin:0}
.soloface .orb{width:128px;height:128px;margin-top:12px}
.soloface .surname{font-size:34px}
.soloface.sm{width:min(50vw,190px);padding:12px 10px 12px}
.soloface.sm .orb{width:90px;height:90px;margin-top:10px}
.soloface.sm .surname{font-size:27px}
.ribbon{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:4;white-space:nowrap;font-weight:700;font-size:12.5px;padding:4px 12px;border-radius:999px;color:#1B1204;background:linear-gradient(90deg,var(--y),var(--o));box-shadow:0 0 18px rgba(255,178,30,.6)}

/* Testi e azioni */
.q{margin:18px 0 0;font-family:var(--display);font-weight:900;font-size:clamp(30px,9vw,40px);line-height:.95;max-width:15ch}
.sub{margin:8px auto 0;font-size:14px;color:var(--ink-soft);max-width:34ch}
.actions{display:flex;justify-content:center;gap:52px;margin-top:18px}
.actcol{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-soft)}
.act{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--hud);border:2px solid currentColor;transition:transform .15s ease,box-shadow .2s ease}
.act svg{width:30px;height:30px}
.act.no{color:var(--no)} .act.yes{color:var(--yes)}
.act:hover{box-shadow:0 0 30px -6px currentColor}
.act:active{transform:scale(.9)}
.btns{display:flex;gap:10px;justify-content:center;margin:16px auto 0;width:100%;max-width:360px}
.btn{flex:1;min-height:50px;border-radius:14px;border:1px solid var(--hud-line);background:var(--hud);color:var(--ink);font-weight:700;font-size:15px;padding:10px 14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.15}
.btn.primary{border-color:transparent;color:#1B1204;background:linear-gradient(90deg,var(--y),var(--o));box-shadow:0 10px 30px -12px rgba(255,107,44,.8)}
.btn.ghost{background:transparent}
.linkbtn{background:none;border:0;padding:8px 6px;color:var(--ink-soft);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.minor{display:flex;gap:18px;justify-content:center;margin-top:2px}
.mark{position:absolute;top:16px;z-index:6;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;border:3px solid currentColor;background:rgba(5,16,12,.66);pointer-events:none}
.mark svg{width:28px;height:28px}
.mark.no{left:14px;color:var(--no);opacity:var(--l,0)}
.mark.yes{right:14px;color:var(--yes);opacity:var(--r,0)}

/* Scelta del compagno */
.pickhead{display:flex;flex-direction:column;align-items:center;width:100%}
.pickhead .q{margin-top:14px}
.search{width:100%;max-width:360px;margin-top:12px;min-height:44px;border-radius:12px;border:1px solid var(--hud-line);background:var(--hud);padding:8px 14px;font-size:16px;color:var(--ink)}
.search::placeholder{color:var(--ink-soft)}
.carousel{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;width:calc(100% + 32px);margin:6px -16px 0;padding:14px calc(50% - 56px) 18px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.carousel::-webkit-scrollbar{display:none}
.mcard{flex:none;width:112px;scroll-snap-align:center;border:0;padding:0;background:none;text-align:center;transition:opacity .2s}
.mholo{padding:1.5px;border-radius:18px;background:linear-gradient(160deg,var(--tier),rgba(243,236,221,.25));box-shadow:0 16px 30px -18px rgba(0,0,0,.7)}
.mcard .face{border-radius:16.5px;padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center}
.mcard .orb{width:62px;height:62px}
.mcard .surname{font-size:19px;margin-top:8px}
.mcard .fname{font-size:11px}
.mcard .pct{position:absolute;top:6px;right:6px;z-index:3;font-size:11px;font-weight:700;padding:1px 6px;border-radius:999px;background:rgba(5,16,12,.75);color:var(--y)}
.pairup{position:relative;width:100%;height:292px}
.pairup .slot{position:absolute;top:6px}
.pairup .slot.a{left:50%;margin-left:-168px;transform:rotate(-6deg)}
.pairup .slot.b{left:50%;margin-left:-2px;transform:rotate(6deg) translateY(10px)}

/* Effetti */
.slash{position:absolute;inset:0;z-index:8;pointer-events:none}
.slash i{position:absolute;left:50%;top:50%;width:118%;height:10px;border-radius:6px;background:var(--no);box-shadow:0 0 18px var(--no),0 0 42px var(--no)}
.slash i:first-child{animation:slashA .2s ease-out forwards;transform:translate(-50%,-50%) rotate(45deg) scaleX(0)}
.slash i:last-child{animation:slashB .2s .12s ease-out forwards;transform:translate(-50%,-50%) rotate(-45deg) scaleX(0)}
@keyframes slashA{to{transform:translate(-50%,-50%) rotate(45deg) scaleX(1)}}
@keyframes slashB{to{transform:translate(-50%,-50%) rotate(-45deg) scaleX(1)}}
.spark{position:absolute;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--y);box-shadow:0 0 10px var(--o);z-index:9;pointer-events:none}
.flash{position:absolute;left:50%;top:38%;width:360px;height:360px;margin:-180px 0 0 -180px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,178,30,.5) 35%,rgba(255,178,30,0) 70%);pointer-events:none;z-index:9;opacity:0}
.in-up{animation:inUp .65s cubic-bezier(.2,.9,.3,1.15) backwards}
@keyframes inUp{from{opacity:0;transform:translateY(70px) scale(.84) rotateX(30deg)}}
.in-right{animation:inRight .55s cubic-bezier(.2,.9,.3,1.15) backwards}
@keyframes inRight{from{opacity:0;transform:translateX(160px) rotate(16deg) scale(.9)}}
.pop{animation:pop .7s cubic-bezier(.2,1.4,.4,1) backwards}
@keyframes pop{from{opacity:0;transform:scale(.55) rotateY(-40deg)}}

/* Fine */
.endwrap{width:100%;text-align:left}
.endwrap h1{font-family:var(--display);font-weight:900;font-size:clamp(36px,10.5vw,48px);line-height:.92;margin:6px 0 0}
.endwrap .sub{margin-left:0;max-width:none}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.tile{position:relative;border-radius:18px;padding:1.5px;background:linear-gradient(140deg,var(--o),var(--y),var(--m))}
.tile.conf{background:linear-gradient(140deg,var(--m),var(--sand))}
.tile .face{border-radius:16.5px;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:118px}
.minis{display:flex}
.minis .orb{width:40px;height:40px}
.minis .orb+.orb{margin-left:-10px}
.tname{font-family:var(--display);font-weight:800;font-size:18px;line-height:1.05;text-transform:uppercase;color:var(--c-ink);overflow-wrap:anywhere}
.tkind{font-size:11.5px;color:var(--c-soft)}
.tbtn{position:absolute;right:8px;width:32px;height:32px;border-radius:10px;border:1px solid var(--c-line);background:rgba(243,236,221,.06);color:var(--c-ink);display:grid;place-items:center;z-index:2;padding:0;font-size:18px;line-height:1}
.tbtn svg{width:16px;height:16px}
.tbtn.share{top:8px}
.tbtn.rm{bottom:8px}
.pending{margin-top:14px;padding:12px;border-radius:14px;border:1px dashed var(--hud-line);background:var(--hud)}
.pending p{margin:0 0 8px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{border:1px solid var(--hud-line);background:transparent;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600}
.sec{margin-top:26px}
.sec h2{font-family:var(--display);font-weight:800;font-size:26px;line-height:1;margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lh{font-size:14px;font-weight:700;margin:16px 0 2px}
.rlist{list-style:none;margin:0;padding:0}
.rrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.rrow .orb{width:34px;height:34px}
.rn{display:block;font-family:var(--display);font-weight:800;font-size:18px;text-transform:uppercase;line-height:1.05}
.rbar{display:block;height:4px;border-radius:9px;background:var(--line);margin-top:5px;overflow:hidden}
.rbar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--o),var(--y))}
.rbar.m i{background:var(--yes)} .rbar.x i{background:var(--no)}
.rv{font-family:var(--display);font-weight:800;font-size:20px;text-align:right;line-height:1}
.rv small{display:block;font-family:var(--ui);font-weight:500;font-size:11px;color:var(--ink-soft)}
.savebar{margin-top:16px;display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--hud);border:1px solid var(--hud-line)}
.savebar p{margin:0;font-size:13.5px;flex:1;text-align:left}
.savebar .btn{flex:none;min-height:42px;font-size:14px}

/* Foglio di condivisione e lista */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(3,10,8,.62)}
.sheet-panel{position:relative;width:100%;max-width:460px;max-height:94vh;overflow:auto;background:var(--bg0);border-top:1px solid var(--hud-line);border-radius:24px 24px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom));animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet-panel h3{font-family:var(--display);font-weight:900;font-size:32px;line-height:1;margin:0 0 6px;text-transform:uppercase}
.sheet-sub{margin:0 0 14px;color:var(--ink-soft);font-size:14px;line-height:1.45}
.story-wrap{display:grid;place-items:center}
.story-img{display:block;width:min(58vw,240px);aspect-ratio:9/16;height:auto;border-radius:14px;background:#0B2019;box-shadow:0 20px 50px -20px rgba(0,0,0,.7)}
.story-img.loading{display:grid;place-items:center;color:#F3ECDD;font-size:14px;animation:pulse 1.1s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.6}to{opacity:1}}
.share-actions{display:flex;gap:10px;margin-top:16px}
.share-actions .btn{flex:1}
.micro{font-size:12.5px;color:var(--ink-soft);margin:10px 0 0;text-align:center}
.sheet-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}
.sheet-foot .btn{flex:none;min-width:110px}
.linkish{background:none;border:0;padding:8px 0;color:var(--no);text-decoration:underline;text-underline-offset:3px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:var(--ink);color:var(--bg0);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;width:max-content;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ===== v5: card FantaBeach Poster 2027 con bordo colorato ===== */
.cborder{position:relative;padding:4px;border-radius:28px;background:linear-gradient(135deg,#FFBA38,#FF7208,#FF422A,#F3ECDD,#3FD6A0);background:conic-gradient(from var(--ang),#FFBA38,#FF7208,#FF422A,#F3ECDD,#3FD6A0,#FFBA38);animation:spin 7s linear infinite;box-shadow:0 30px 60px -26px rgba(255,114,8,.6),0 0 26px -8px rgba(255,186,56,.55)}
.cborder.thin{padding:3px;border-radius:21px;animation-duration:10s;box-shadow:0 16px 30px -18px rgba(0,0,0,.6),0 0 14px -6px rgba(255,186,56,.45)}
.cborder.xs{padding:2px;border-radius:16px;animation:none;background:linear-gradient(140deg,#FFBA38,#FF7208,#FF422A,#3FD6A0);box-shadow:0 12px 24px -16px rgba(0,0,0,.7)}
.vX{position:relative;display:block;container-type:inline-size;aspect-ratio:320/430;border-radius:24px;overflow:hidden;color:#F3ECDD;text-align:center;
  --figw:82%;--figtop:5%;--figl:30%;--figr:70%;--figdrop:2%;--sil:rgba(12,20,17,.96);--jersey:#2D5C4F;
  box-shadow:inset 0 0 0 1px rgba(243,236,221,.28)}
.cborder.thin .vX{border-radius:18px}
.cborder.xs .vX{border-radius:14px}
.vX .bg{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,#0B5C4A 0%,#06362B 60%,#042219 100%)}
.vX .bg>*{position:absolute;pointer-events:none}
.vX .halftone{inset:0;background-image:radial-gradient(rgba(255,186,56,.26) 1.2px,transparent 1.7px);background-size:9px 9px;-webkit-mask-image:radial-gradient(72% 56% at 50% 38%,#000 15%,transparent 80%);mask-image:radial-gradient(72% 56% at 50% 38%,#000 15%,transparent 80%)}
.vX .big{left:50%;top:10%;font-family:var(--display);font-weight:900;font-size:188px;font-size:59cqw;line-height:.8;white-space:nowrap;transform:translateX(-50%) rotate(-8deg)}
.vX .b1{color:transparent;-webkit-text-stroke:2.5px #FF7208}
.vX .b2{color:rgba(255,186,56,.24);transform:translateX(calc(-50% + 3cqw)) rotate(-8deg);animation:drift2027 5s ease-in-out infinite alternate}
@keyframes drift2027{to{transform:translateX(calc(-50% - 2cqw)) rotate(-8deg)}}
.vX .glow{left:50%;top:38%;width:105%;aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,244,214,.96) 0%,rgba(255,186,56,.4) 23%,rgba(255,114,8,0) 50%);animation:breathe 4.5s ease-in-out infinite}
@keyframes breathe{50%{opacity:.8;transform:translate(-50%,-50%) scale(1.07)}}
.vX .ground{position:absolute;left:0;right:0;bottom:0;height:37%;z-index:3;background:linear-gradient(to bottom,rgba(6,58,45,0),#063A2D 15%,#02201A)}
.vX .alabel{position:absolute;top:4.4cqw;left:4.4cqw;z-index:5;font-weight:700;font-size:12px;font-size:3.8cqw;line-height:1.3;padding:.9cqw 3cqw;border-radius:999px;color:#F3ECDD;background:rgba(4,14,10,.52);border:1px solid rgba(243,236,221,.16);white-space:nowrap}
.vX .alabel.hot{color:#1B1204;background:linear-gradient(90deg,#FFBA38,#FF7208);border-color:transparent;box-shadow:0 0 14px rgba(255,186,56,.6)}

.vX .figs{position:absolute;inset:0;z-index:2}

function key(a,b){ return a<b ? a+"|"+b : b+"|"+a; }
function stayPct(p){ var r=(h32(p.id+"#stay")%1000)/1000; return Math.round(Math.min(85,Math.max(22,30+p.tappe*4.5+(r*24-12)))); }
var cntCache={};
function pairCount(a,b){
  var k=key(a,b); if(cntCache[k]!=null) return cntCache[k];
  var A=ATH[a], B=ATH[b], r=(h32(k)%10007)/10007;
  var close=1/(1+Math.abs(A.pos-B.pos)/10), fame=1/(1+(A.pos+B.pos)/25);
  var w=Math.pow(r,3)*0.8+close*r*0.45+fame*r*0.9, p=p26Of(a);
  if(p && mateOf(p,a)===b) w+=(stayPct(p)/100)*2.2;
  cntCache[k]=Math.max(1,Math.round(w*40));
  return cntCache[k];
}
function pairPct(a,b){
  var tot=0; LIST[ATH[a].g].forEach(function(x){ if(x.id!==a) tot+=pairCount(a,x.id); });
  return Math.max(1,Math.round(pairCount(a,b)/tot*100));
}
function pctFor(x){ var p=p26Of(x.a); if(x.kind==="confermata" && p) return stayPct(p); var c=x.chooser||x.a; return pairPct(c, c===x.a?x.b:x.a); }

function pairById(id){ var L=P26[S.g]; for(var i=0;i<L.length;i++) if(L[i].id===id) return L[i]; return null; }

/* Un atleta sta in una sola coppia */
function addPair(a,b){
  var st=S.G[ATH[a].g];
  st.pairs=st.pairs.filter(function(x){ return !(x.a===a||x.b===a||x.a===b||x.b===b); });
  st.deferred=st.deferred.filter(function(id){ return id!==a && id!==b; });
  var pa=p26Of(a), same=!!(pa && mateOf(pa,a)===b);
  if(same) st.votes[pa.id]="stay";
  var A=ATH[a], B=ATH[b], x=(B.pos<A.pos)?{a:b,b:a}:{a:a,b:b};
  x.kind=same?"confermata":"nuova"; x.chooser=a;
  st.pairs.push(x);
  return x;
}
function removePair(i){
  var st=gs(), x=st.pairs[i]; if(!x) return;
  st.pairs.splice(i,1);
  if(x.kind==="confermata"){ var p=p26Of(x.a); if(p) delete st.votes[p.id]; }
  else [x.a,x.b].forEach(function(id){ if(st.deferred.indexOf(id)<0) st.deferred.push(id); });
  if(st.mode==="end" || (st.mode==="created" && st.cur.pair===x)) advance();
}

/* Prossimo passo: prima chi è rimasto senza compagno, poi le coppie del mazzo */
function advance(){
  var st=gs();
  while(st.queue.length){
    var pid=st.queue.shift();
    if(isPlaced(pid) || st.deferred.indexOf(pid)>=0) continue;
    st.mode="orphan"; st.cur={pid:pid, why:"split"}; return;
  }
  var deck=DECK[S.g];
  for(var i=0;i<deck.length;i++){
    var p=deck[i]; if(st.votes[p.id]) continue;
    var aP=isPlaced(p.a), bP=isPlaced(p.b);
    if(aP || bP){
      st.votes[p.id]="split";
      if(aP && bP) continue;
      var orphan=aP?p.b:p.a;
      if(st.deferred.indexOf(orphan)>=0) continue;
      st.mode="orphan"; st.cur={pid:orphan, why:"moved", moved:aP?p.a:p.b}; return;
    }
    st.mode="pair"; st.cur={pairId:p.id}; return;
  }
  st.mode="end"; st.cur={};
}

function communityHTML(){

    var a=L[i].id, b=L[j].id, p=p26Of(a);

/* ---------- Movimento ---------- */
function hideFloor(){ document.querySelectorAll(".floorshadow").forEach(function(f){ f.style.opacity="0"; }); }
function bindTilt(el){
  if(RM || !el) return;
  function mv(e){ var r=el.getBoundingClientRect(), x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5;
    el.style.setProperty("--ry",(x*16).toFixed(2)+"deg"); el.style.setProperty("--rx",(-y*16).toFixed(2)+"deg"); el.style.setProperty("--sx",(100-(x+.5)*100).toFixed(1)+"%"); }
  function lv(){ el.style.setProperty("--ry","0deg"); el.style.setProperty("--rx","0deg"); el.style.setProperty("--sx","110%"); }
  el.addEventListener("pointermove",mv); el.addEventListener("pointerleave",lv); el.addEventListener("pointercancel",lv);
}
function bindSwipe(){
  var card=$("#card"); if(!card) return;
  var x0=0, dx=0, on=false, TH=90;
  card.style.touchAction="pan-y";
  function set(v){ card.style.transform = v ? "translateX("+v+"px) rotate("+(v/16)+"deg)" : ""; card.style.setProperty("--l",Math.min(1,Math.max(0,-v/TH))); card.style.setProperty("--r",Math.min(1,Math.max(0,v/TH))); }
  card.addEventListener("pointerdown",function(e){ if(S.busy || (e.pointerType==="mouse" && e.button!==0)) return; on=true; x0=e.clientX; dx=0; card.classList.add("dragging"); try{ card.setPointerCapture(e.pointerId); }catch(_){} });
  card.addEventListener("pointermove",function(e){ if(!on) return; dx=e.clientX-x0; set(dx); });
  card.addEventListener("pointerup",function(){
    if(!on) return; on=false; card.classList.remove("dragging");
    if(dx<=-TH) actNo(); else if(dx>=TH) actYes(); else set(0);
  });
  card.addEventListener("pointercancel",function(){ on=false; card.classList.remove("dragging"); set(0); });
}
function bindCoverflow(c){
  if(RM) return;
  function upd(){ var r=c.getBoundingClientRect(), cx=r.left+r.width/2;
    c.querySelectorAll(".mcard").forEach(function(el){ var b=el.getBoundingClientRect(), d=(b.left+b.width/2-cx)/(r.width/2), ad=Math.min(1,Math.abs(d));
      el.style.transform="perspective(700px) rotateY("+(-d*32).toFixed(1)+"deg) scale("+(1-ad*.14).toFixed(3)+")"; el.style.opacity=(1-ad*.4).toFixed(2); }); }
  var raf=0; c.addEventListener("scroll",function(){ if(!raf) raf=requestAnimationFrame(function(){ raf=0; upd(); }); },{passive:true});
  upd();
}
function slash(card,done){
  if(RM){ done(); return; }
  var s=document.createElement("div"); s.className="slash"; s.innerHTML="<i></i><i></i>"; card.appendChild(s);
  setTimeout(done,360);
}
function tear(card,done){
  if(RM){ done(); return; }
  var stage=$("#stage"), r=card.getBoundingClientRect(), s=stage.getBoundingClientRect(), pts=[], n=12;
  for(var i=0;i<=n;i++){ var x=50+(i%2?5:-5)+(Math.random()*4-2); pts.push(x.toFixed(1)+"% "+(i/n*100).toFixed(1)+"%"); }
  var polys=["polygon(0% 0%, "+pts.join(", ")+", 0% 100%)","polygon(100% 0%, "+pts.join(", ")+", 100% 100%)"];
  var pieces=polys.map(function(poly){
    var c=card.cloneNode(true); c.removeAttribute("id"); c.classList.remove("in-up","dragging");
    c.style.cssText="position:absolute;margin:0;z-index:7;left:"+(r.left-s.left)+"px;top:"+(r.top-s.top)+"px;width:"+r.width+"px;height:"+r.height+"px;clip-path:"+poly+";-webkit-clip-path:"+poly+";transform:none;transition:none";
    stage.appendChild(c); return c;
  });
  card.style.visibility="hidden";
  for(var k=0;k<16;k++){
    var sp=document.createElement("span"); sp.className="spark";
    sp.style.left=(r.left-s.left+r.width*(.45+Math.random()*.1))+"px"; sp.style.top=(r.top-s.top+Math.random()*r.height)+"px";
    stage.appendChild(sp);
    var ang=Math.random()*Math.PI*2, dist=30+Math.random()*60;
    var an=sp.animate([{transform:"translate(0,0) scale(1)",opacity:1},{transform:"translate("+(Math.cos(ang)*dist).toFixed(1)+"px,"+(Math.sin(ang)*dist).toFixed(1)+"px) scale(.2)",opacity:0}],{duration:500+Math.random()*250,easing:"cubic-bezier(.2,.7,.4,1)",fill:"forwards"});
    an.onfinish=(function(el){ return function(){ el.remove(); }; })(sp);
  }
  pieces[0].animate([{transform:"translate(0,0) rotate(0deg)",opacity:1},{transform:"translate(-8px,0) rotate(-1.5deg)",opacity:1,offset:.14},{transform:"translate(-110px,90px) rotate(-24deg)",opacity:0}],{duration:820,easing:"cubic-bezier(.45,0,.8,.55)",fill:"forwards"});
  var a2=pieces[1].animate([{transform:"translate(0,0) rotate(0deg)",opacity:1},{transform:"translate(8px,0) rotate(1.5deg)",opacity:1,offset:.14},{transform:"translate(110px,90px) rotate(24deg)",opacity:0}],{duration:820,easing:"cubic-bezier(.45,0,.8,.55)",fill:"forwards"});
  a2.onfinish=function(){ pieces.forEach(function(p){ p.remove(); }); done(); };
}
function flyToCounter(el,done){
  if(RM || !el){ done(); return; }
  var cur=el.style.transform||"translate(0px,0px)"; el.style.transform=""; var r=el.getBoundingClientRect(); el.style.transform=cur;
  var t=$("#mine").getBoundingClientRect(), dx=(t.left+t.width/2)-(r.left+r.width/2), dy=(t.top+t.height/2)-(r.top+r.height/2);
  var an=el.animate([{transform:cur,opacity:1},{transform:"translate(0px,-34px) scale(1.05) rotate(-2deg)",opacity:1,offset:.25},{transform:"translate("+dx.toFixed(0)+"px,"+dy.toFixed(0)+"px) scale(.06) rotate(12deg)",opacity:.25}],{duration:720,easing:"cubic-bezier(.55,0,.35,1)",fill:"forwards"});
  an.onfinish=done;
}
function dropOut(el,done){
  if(RM || !el){ done(); return; }
  el.animate([{transform:"translateY(0) scale(1)",opacity:1},{transform:"translateY(140px) scale(.9) rotateX(24deg)",opacity:0}],{duration:420,easing:"cubic-bezier(.5,0,.8,.4)",fill:"forwards"}).onfinish=done;
}
function flash(){
  if(RM) return;
  var f=document.createElement("div"); f.className="flash"; $("#stage").appendChild(f);
  f.animate([{opacity:0,transform:"scale(.6)"},{opacity:1,transform:"scale(1)",offset:.3},{opacity:0,transform:"scale(1.3)"}],{duration:560,easing:"ease-out"}).onfinish=function(){ f.remove(); };
}
function merge(done){
  if(RM){ done(); return; }
  var A=$("#cardA"), B=$("#cardB"); if(!A||!B){ done(); return; }
  A.animate([{transform:"translate(0,0) scale(1)"},{transform:"translate(40%,0) scale(.72)",opacity:0}],{duration:440,easing:"cubic-bezier(.6,0,.4,1)",fill:"forwards"});
  B.animate([{transform:"translate(0,0) scale(1)"},{transform:"translate(-40%,0) scale(.72)",opacity:0}],{duration:440,easing:"cubic-bezier(.6,0,.4,1)",fill:"forwards"}).onfinish=function(){ flash(); done(); };
}
function burst(){
  if(RM) return;
  var stage=$("#stage"), card=$("#card"); if(!card) return;
  var r=card.getBoundingClientRect(), s=stage.getBoundingClientRect(), cx=r.left-s.left+r.width/2, cy=r.top-s.top+r.height/2, cols=["#FF6B2C","#FFB21E","#3FD6A0","#F3ECDD"];
  for(var i=0;i<28;i++){
    var d=document.createElement("span"); d.className="spark"; d.style.left=cx+"px"; d.style.top=cy+"px"; d.style.background=cols[i%4]; d.style.boxShadow="0 0 12px "+cols[i%4];

    var an=d.animate([{transform:"translate(0,0) scale(1.2)",opacity:1},{transform:"translate("+(Math.cos(ang)*dist).toFixed(1)+"px,"+(Math.sin(ang)*dist).toFixed(1)+"px) scale(.3)",opacity:0}],{duration:750+Math.random()*350,easing:"cubic-bezier(.15,.7,.3,1)",fill:"forwards"});
    an.onfinish=(function(el){ return function(){ el.remove(); }; })(d);
  }

/* ---------- Azioni ---------- */
function lock(){ S.busy=true; } function unlock(){ S.busy=false; }
function actYes(){
  var st=gs(); if(S.busy || st.mode!=="pair") return;
  var p=pairById(st.cur.pairId); lock(); hideFloor();
  flyToCounter($("#card"),function(){ addPair(p.a,p.b); advance(); render("in-up"); updateTop(true); unlock(); announce(ATH[p.a].short+" e "+ATH[p.b].short+": restano insieme"); });
}
function actNo(){
  var st=gs(); if(S.busy || st.mode!=="pair") return;
  var p=pairById(st.cur.pairId), card=$("#card"); lock(); hideFloor();
  slash(card,function(){ tear(card,function(){
    st.votes[p.id]="split";
    st.queue=[p.b]; st.mode="pick"; st.cur={pid:p.a, undoPair:p.id, q:""};
    render("in-up"); unlock(); announce(ATH[p.a].short+" e "+ATH[p.b].short+": si separano");
  }); });
}
function actCand(cid){ var st=gs(); if(S.busy || st.mode!=="pick") return; st.cur.cand=cid; st.mode="confirm"; render(); }
function actConfirm(){
  var st=gs(); if(S.busy || st.mode!=="confirm") return;
  var a=st.cur.pid, b=st.cur.cand; lock();
  merge(function(){
    var x=addPair(a,b);
    st.queue=st.queue.filter(function(id){ return id!==b; });
    st.mode="created"; st.cur={pair:x};
    render(); burst(); updateTop(true); unlock(); announce("Nuova coppia: "+pairName(x));
  });
}
function actContinue(){
  var st=gs(); if(S.busy || st.mode!=="created") return; lock(); hideFloor();
  flyToCounter($("#card"),function(){ advance(); render("in-up"); unlock(); });
}
function actLater(){
  var st=gs(), pid=st.cur.pid; if(S.busy || !pid) return;
  if(st.deferred.indexOf(pid)<0) st.deferred.push(pid);
  lock(); hideFloor();
  dropOut($("#card"),function(){ advance(); render("in-up"); unlock(); });
}
function actUndo(){
  var st=gs(), pid=st.cur.undoPair; if(S.busy || !pid) return;
  delete st.votes[pid]; st.queue=[]; st.mode="pair"; st.cur={pairId:pid}; render("in-up");
}
function openMine(refreshOnly){
  var panel=$("#sheet-panel");
  if(refreshOnly && ($("#sheet").hidden || !panel.querySelector('[data-sheet="mine"]'))) return;
  var st=gs(), n=st.pairs.length;
  var html='<div class="grab" aria-hidden="true" data-sheet="mine"></div><h3 id="sheet-title">Le mie coppie</h3>'
    +'<p class="sheet-sub">'+(n?n+(n===1?' coppia':' coppie')+' nel '+(S.g==="F"?'femminile':'maschile')+'. Toccane una per condividerla o toglila.':'Ancora nessuna coppia: rispondi alla prima card.')+'</p>'
    +(n?'<div class="tiles">'+st.pairs.map(function(x,i){ return tileHTML(x,i,true); }).join("")+'</div><div class="btns" style="max-width:none"><button type="button" class="btn primary" data-act="share-market">Condividi il tuo mercato</button></div>':'')
    +'<div class="sheet-foot"><span class="sim">Voti simulati</span><button type="button" class="btn" data-act="close">Chiudi</button></div>';
  if(refreshOnly){ panel.innerHTML=html; fit(panel); return; }
  openSheet(html,'[data-act="close"]'); fit(panel);
}

function setFont(ctx,spec,size,family){ ctx.font=spec+" "+size+"px "+family; }
function fitFont(ctx,text,spec,size,maxW,family,min){ var s=size; setFont(ctx,spec,s,family); while(ctx.measureText(text).width>maxW && s>(min||10)){ s-=1; setFont(ctx,spec,s,family); } return s; }
function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r); ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath(); }
function drawFigure(ctx,a,x,y,s){

  if(!hasPhoto(a)){ ctx.fillStyle="rgba(12,20,17,.96)"; ctx.fill(new Path2D(FIG.bust)); ctx.restore(); return; }

  ctx.beginPath(); ctx.ellipse(50,40,17,20,0,0,Math.PI*2); ctx.fill();
  if(L.style==="cap"){ ctx.fillStyle="#FFFFFF"; ctx.fill(new Path2D(FIG.cap)); ctx.fillStyle="#EDE4D0"; ctx.fill(new Path2D(FIG.brim)); }
  else if(L.style==="bun"){ ctx.fillStyle=L.hair; ctx.beginPath(); ctx.arc(50,15,7,0,Math.PI*2); ctx.fill(); ctx.fill(new Path2D(FIG.short)); }
  else { ctx.fillStyle=L.hair; ctx.fill(new Path2D(FIG[L.style])); }

  ctx.strokeStyle="rgba(255,255,255,.6)"; ctx.lineWidth=3; ctx.lineCap="round"; ctx.stroke(new Path2D(FIG.vneck));

function borderGradient(ctx,x,y,w,h){

}
/* Card Poster: A e B (B facoltativo), etichetta, statistiche [[valore, etichetta]] */
function drawPosterCard(ctx,A,B,x,y,w,o){
  var h=Math.round(w*430/320), s=w/320, R=24*s, bw=Math.max(8,6*s), cx=x+w/2, cy=y+h*.38;

  ctx.save(); rr(ctx,x,y,w,h,R); ctx.clip();
  var bg=ctx.createLinearGradient(0,y,0,y+h); bg.addColorStop(0,"#0B5C4A"); bg.addColorStop(.6,"#06362B"); bg.addColorStop(1,"#042219"); ctx.fillStyle=bg; ctx.fillRect(x,y,w,h);

  setFont(ctx,"900",Math.round(188*s),DISPLAY);

  if(B){ fig(B,.70,.02,w*.82); fig(A,.30,0,w*.82); } else fig(A,.5,-.01,w*.96);
  var gd=ctx.createLinearGradient(0,y+h*.63,0,y+h); gd.addColorStop(0,"rgba(6,58,45,0)"); gd.addColorStop(.15,"#063A2D"); gd.addColorStop(1,"#02201A"); ctx.fillStyle=gd; ctx.fillRect(x,y+h*.63,w,h*.37+1);
  setFont(ctx,"700",Math.round(12*s),UI); var lw=ctx.measureText(o.label).width+20*s, lh=22*s, lx=x+14*s, ly=y+14*s;
  rr(ctx,lx,ly,lw,lh,lh/2);

  ctx.fill(); ctx.fillStyle=o.hot?"#1B1204":"#F3ECDD"; ctx.textAlign="left"; ctx.textBaseline="middle"; ctx.fillText(o.label,lx+10*s,ly+lh/2+s);
  if(BADGE_IMG){ var bs=34*s, bx=x+w-12*s-bs, by=y+12*s; ctx.beginPath(); ctx.arc(bx+bs/2,by+bs/2,bs/2+2*s,0,Math.PI*2); ctx.fillStyle="#FFFFFF"; ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.arc(bx+bs/2,by+bs/2,bs/2,0,Math.PI*2); ctx.clip(); ctx.drawImage(BADGE_IMG,bx,by,bs,bs); ctx.restore(); }
  ctx.textAlign="center"; ctx.textBaseline="alphabetic";
  var ny=y+h*.715, colW=B?(w-24*s)/2:(w-24*s);
  (B?[[A,x+12*s+colW/2],[B,x+12*s+colW*1.5]]:[[A,x+w/2]]).forEach(function(n){
    var up=n[0].last.toUpperCase(); ctx.fillStyle="#F3ECDD"; fitFont(ctx,up,"900",Math.round(27*s),colW-8*s,DISPLAY,10); ctx.fillText(up,n[1],ny+26*s);
    ctx.fillStyle="rgba(243,236,221,.78)"; fitFont(ctx,n[0].first,"500",Math.round(12*s),colW-8*s,UI,8); ctx.fillText(n[0].first,n[1],ny+42*s);
  });

  o.stats.forEach(function(st,i){ var ccx=sx+sw*(i+.5)/o.stats.length, cw=sw/o.stats.length-10*s;
    ctx.fillStyle="#F3ECDD"; fitFont(ctx,String(st[0]),"800",Math.round(25*s),cw,DISPLAY,10); ctx.fillText(String(st[0]),ccx,sy+28*s);
    ctx.fillStyle="rgba(243,236,221,.75)"; fitFont(ctx,st[1],"500",Math.round(10.5*s),cw,UI,8); ctx.fillText(st[1],ccx,sy+44*s); });
  rr(ctx,x+.75*s,y+.75*s,w-1.5*s,h-1.5*s,R); ctx.strokeStyle="rgba(243,236,221,.28)"; ctx.lineWidth=1.5*s; ctx.stroke();

function storyBase(ctx,W,H){
  var bg=ctx.createLinearGradient(0,0,0,H); bg.addColorStop(0,"#0D5A48"); bg.addColorStop(.5,"#063026"); bg.addColorStop(1,"#03140F");
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  for(var yy=10; yy<H; yy+=22){ for(var xx=10; xx<W; xx+=22){ var d=Math.hypot((xx-W*.5)/W,(yy-H*.42)/H); var al=Math.max(0,.12-d*.18); if(al<=.01) continue; ctx.fillStyle="rgba(255,186,56,"+al.toFixed(3)+")"; ctx.beginPath(); ctx.arc(xx,yy,2.4,0,Math.PI*2); ctx.fill(); } }
  var lh=100, lw=LOGO_IMG ? Math.round(lh*LOGO_IMG.naturalWidth/LOGO_IMG.naturalHeight) : 270;
  rr(ctx,64,56,lw+56,lh+34,(lh+34)/2); ctx.fillStyle="rgba(243,236,221,.96)"; ctx.fill();

}

function newCanvas(){ var c=document.createElement("canvas"); c.width=1080; c.height=1920; return c; }

/* ---------- Infrastruttura ---------- */
function fit(root){
  (root||document).querySelectorAll(".surname").forEach(function(el){
    el.style.fontSize="";
    var size=parseFloat(getComputedStyle(el).fontSize), guard=0;
    while(el.scrollWidth>el.clientWidth+1 && size>12 && guard<40){ size-=1; el.style.fontSize=size+"px"; guard++; }
  });
}
function openSheet(html,focusSel){
  S.lastFocus=document.activeElement;
  $("#sheet-panel").innerHTML=html;
  $("#sheet").hidden=false;
  document.body.style.overflow="hidden";
  $("#toast").classList.remove("on");
  var f=focusSel?$(focusSel):$("#sheet-panel button");
  if(f){ try{ f.focus({preventScroll:true}); }catch(_){ f.focus(); } }
}
function closeSheet(){
  share.token++; share.blob=null; share.undo=null;
  $("#sheet").hidden=true;
  document.body.style.overflow="";
  if(S.lastFocus && document.contains(S.lastFocus)){ try{ S.lastFocus.focus({preventScroll:true}); }catch(_){} }
}
var tt=null;
function toast(msg){ var t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(tt); tt=setTimeout(function(){ t.classList.remove("on"); },2400); }

document.addEventListener("click",function(e){
  var t=e.target.closest("[data-act],[data-g],[data-cand],[data-pick],[data-rm]");
  if(!t || t.disabled) return;
  var d=t.dataset, st=gs();
  if(d.g!==undefined){ if(S.busy || d.g===S.g) return; S.g=d.g; render("in-up"); return; }
  if(d.cand!==undefined){ actCand(d.cand); return; }
  if(d.pick!==undefined){ if(S.busy) return; st.mode="pick"; st.cur={pid:d.pick,q:""}; render("in-up"); toTop(); return; }
  if(d.rm!==undefined){ var rx=st.pairs[+d.rm]; removePair(+d.rm); render("none"); openMine(true); if(rx) toast("Tolta "+pairName(rx)); return; }
  switch(d.act){
    case "yes": actYes(); break;
    case "no": actNo(); break;
    case "change": if(!S.busy){ st.mode="pick"; delete st.cur.cand; render("none"); } break;
    case "confirm": actConfirm(); break;
    case "continue": actContinue(); break;
    case "share-created": if(st.cur.pair) openShare(st.cur.pair,false); break;
    case "orphan-pick": if(!S.busy){ st.mode="pick"; st.cur={pid:st.cur.pid,q:""}; render("none"); } break;
    case "later": actLater(); break;
    case "undo": actUndo(); break;
    case "mine": openMine(false); break;
    case "share-row": if(st.pairs[+d.i]) openShare(st.pairs[+d.i],false); break;
    case "share-market": openMarketShare(); break;
    case "share": doShare(); break;
    case "saveimg": doSave(); break;
    case "save": S.savedOn=new Date().toLocaleDateString("it-IT",{day:"numeric",month:"long",year:"numeric"}); render("none"); toast("Pronostici salvati"); break;
    case "close": closeSheet(); break;
  }
});
document.addEventListener("input",function(e){ if(e.target && e.target.id==="search"){ gs().cur.q=e.target.value; renderCarousel(); } });
document.addEventListener("keydown",function(e){
  if(!$("#sheet").hidden){ if(e.key==="Escape") closeSheet(); return; }
  if(e.target && e.target.id==="search") return;
  var st=gs(); if(S.busy) return;
  if(st.mode==="pair"){ if(e.key==="ArrowLeft") actNo(); else if(e.key==="ArrowRight") actYes(); }
});

}
